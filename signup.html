<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Signup | Finova</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Icons -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <!-- BLUR BACKGROUNDS -->

  <div class="blur-circle circle-one"></div>
  <div class="blur-circle circle-two"></div>

  <!-- SIGNUP SECTION -->

  <section class="auth-section">

    <div class="container">

      <div class="auth-wrapper fade-up">

        <!-- LEFT SIDE -->

        <div class="auth-left">

          <a href="index.html"
            class="logo d-flex align-items-center text-decoration-none mb-5">

            <img src="assets/logo.png" alt="Logo">

            <span>Finova</span>

          </a>

          <h1 class="auth-title">
            Start Your Financial Journey
          </h1>

          <p class="auth-subtitle">

            Create your Finova account and gain access
            to modern financial analytics, budgeting,
            subscriptions, and spending insights.

          </p>

          <div class="auth-features">

            <div class="feature-item">
              <i class="fa-solid fa-chart-pie"></i>
              <span>Track Financial Growth</span>
            </div>

            <div class="feature-item">
              <i class="fa-solid fa-credit-card"></i>
              <span>Manage Smart Budgets</span>
            </div>

            <div class="feature-item">
              <i class="fa-solid fa-lock"></i>
              <span>Protected Cloud Storage</span>
            </div>

          </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="auth-card scale-in">

          <h2 class="mb-4">
            Create Account
          </h2>

          <!-- SIGNUP FORM -->

          <form id="signupForm">

            <!-- NAME -->

            <div class="mb-4">

              <label class="form-label">
                Full Name
              </label>

              <input
                type="text"
                class="form-control custom-input"
                id="name"
                placeholder="Enter your full name"
                required>

            </div>

            <!-- EMAIL -->

            <div class="mb-4">

              <label class="form-label">
                Email Address
              </label>

              <input
                type="email"
                class="form-control custom-input"
                id="email"
                placeholder="Enter your email"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="mb-4">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control custom-input"
                id="password"
                placeholder="Create password"
                required>

            </div>

            <!-- BUTTON -->

            <button type="submit"
              class="primary-btn w-100">

              Create Finova Account

            </button>

          </form>

          <!-- FOOTER -->

          <div class="auth-footer">

            <p>

              Already have an account?

              <a href="login.html">
                Login
              </a>

            </p>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- JS -->

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth.js"></script>

</body>

</html>
