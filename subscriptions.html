<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subscriptions | Finova</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Icons -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">

      <img src="assets/logo.png" alt="Logo">

      <span>Finova</span>

    </div>

    <ul class="sidebar-links">

      <li>
        <a href="dashboard.html">
          <i class="fa-solid fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <li>
        <a href="transactions.html">
          <i class="fa-solid fa-wallet"></i>
          <span>Transactions</span>
        </a>
      </li>

      <li>
        <a href="analytics.html">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Analytics</span>
        </a>
      </li>

      <li>
        <a href="budget.html">
          <i class="fa-solid fa-money-bill"></i>
          <span>Budget</span>
        </a>
      </li>

      <li>
        <a href="subscriptions.html" class="active">
          <i class="fa-solid fa-repeat"></i>
          <span>Subscriptions</span>
        </a>
      </li>

      <li>
        <a href="profile.html">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
      </li>

    </ul>

  </aside>

  <!-- MAIN CONTENT -->

  <main class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

      <div>

        <h2>
          Subscription Manager
        </h2>

        <p>
          Track recurring payments and renewals.
        </p>

      </div>

      <button
        class="primary-btn"
        data-bs-toggle="modal"
        data-bs-target="#subscriptionModal">

        Add Subscription

      </button>

    </div>

    <!-- STATS -->

    <div class="row g-4">

      <div class="col-lg-4">

        <div class="finance-card">

          <h5>Total Monthly Cost</h5>

          <h2 id="monthlySubscriptionCost">
            ₹0
          </h2>

        </div>

      </div>

      <div class="col-lg-4">

        <div class="finance-card">

          <h5>Active Subscriptions</h5>

          <h2 id="subscriptionCount">
            0
          </h2>

        </div>

      </div>

      <div class="col-lg-4">

        <div class="finance-card">

          <h5>Next Renewal</h5>

          <h2 id="nextRenewal">
            --
          </h2>

        </div>

      </div>

    </div>

    <!-- TABLE -->

    <div class="chart-card mt-4">

      <div class="table-responsive">

        <table class="table align-middle">

          <thead>

            <tr>

              <th>Name</th>
              <th>Category</th>
              <th>Renewal Date</th>
              <th>Amount</th>
              <th>Actions</th>

            </tr>

          </thead>

          <tbody id="subscriptionTableBody">

            <!-- DATA -->

          </tbody>

        </table>

      </div>

    </div>

  </main>

  <!-- MODAL -->

  <div class="modal fade"
    id="subscriptionModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content p-3 border-0"
        style="border-radius: 24px;">

        <div class="modal-header border-0">

          <h4>Add Subscription</h4>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal">

          </button>

        </div>

        <div class="modal-body">

          <!-- FORM -->

          <form id="subscriptionForm">

            <!-- NAME -->

            <div class="mb-3">

              <label class="form-label">
                Subscription Name
              </label>

              <input
                type="text"
                id="subscriptionName"
                class="form-control custom-input"
                placeholder="Netflix, Spotify..."
                required>

            </div>

            <!-- CATEGORY -->

            <div class="mb-3">

              <label class="form-label">
                Category
              </label>

              <select
                id="subscriptionCategory"
                class="form-select custom-input"
                required>

                <option value="">
                  Select Category
                </option>

                <option>Entertainment</option>
                <option>Music</option>
                <option>Productivity</option>
                <option>Fitness</option>
                <option>Education</option>

              </select>

            </div>

            <!-- AMOUNT -->

            <div class="mb-3">

              <label class="form-label">
                Monthly Amount
              </label>

              <input
                type="number"
                id="subscriptionAmount"
                class="form-control custom-input"
                placeholder="Enter amount"
                required>

            </div>

            <!-- RENEWAL DATE -->

            <div class="mb-4">

              <label class="form-label">
                Renewal Date
              </label>

              <input
                type="date"
                id="subscriptionDate"
                class="form-control custom-input"
                required>

            </div>

            <!-- BUTTON -->

            <button
              type="submit"
              class="primary-btn w-100">

              Save Subscription

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- BOOTSTRAP -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS -->

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/subscriptions.js"></script>

</body>

</html>
