<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Finova</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Icons -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <!-- BLUR EFFECTS -->

  <div class="blur-circle circle-one"></div>
  <div class="blur-circle circle-two"></div>

  <!-- LOGIN SECTION -->

  <section class="auth-section">

    <div class="container">

      <div class="auth-wrapper fade-up">

        <!-- LEFT SIDE -->

        <div class="auth-left">

          <a href="index.html"
            class="logo d-flex align-items-center text-decoration-none mb-5">

            <img src="assets/logo.png" alt="Logo">

            <span>Finova</span>

          </a>

          <h1 class="auth-title">
            Welcome Back
          </h1>

          <p class="auth-subtitle">

            Log in to continue managing your finances,
            budgets, analytics, and subscriptions.

          </p>

          <div class="auth-features">

            <div class="feature-item">
              <i class="fa-solid fa-chart-line"></i>
              <span>Advanced Financial Analytics</span>
            </div>

            <div class="feature-item">
              <i class="fa-solid fa-wallet"></i>
              <span>Smart Budget Management</span>
            </div>

            <div class="feature-item">
              <i class="fa-solid fa-shield"></i>
              <span>Secure Firebase Authentication</span>
            </div>

          </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="auth-card scale-in">

          <h2 class="mb-4">
            Login
          </h2>

          <!-- LOGIN FORM -->

          <form id="loginForm">

            <!-- EMAIL -->

            <div class="mb-4">

              <label class="form-label">
                Email Address
              </label>

              <input
                type="email"
                class="form-control custom-input"
                id="email"
                placeholder="Enter your email"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="mb-4">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control custom-input"
                id="password"
                placeholder="Enter your password"
                required>

            </div>

            <!-- BUTTON -->

            <button type="submit"
              class="primary-btn w-100">

              Login to Finova

            </button>

          </form>

          <!-- FOOTER -->

          <div class="auth-footer">

            <p>

              Don't have an account?

              <a href="signup.html">
                Create Account
              </a>

            </p>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- JS -->

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth.js"></script>

</body>

</html>
