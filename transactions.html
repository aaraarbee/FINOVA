<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transactions | Finova</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Icons -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">

      <img src="assets/logo.png" alt="Logo">

      <span>Finova</span>

    </div>

    <ul class="sidebar-links">

      <li>
        <a href="dashboard.html">
          <i class="fa-solid fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <li>
        <a href="transactions.html" class="active">
          <i class="fa-solid fa-wallet"></i>
          <span>Transactions</span>
        </a>
      </li>

      <li>
        <a href="analytics.html">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Analytics</span>
        </a>
      </li>

      <li>
        <a href="budget.html">
          <i class="fa-solid fa-money-bill"></i>
          <span>Budget</span>
        </a>
      </li>

      <li>
        <a href="subscriptions.html">
          <i class="fa-solid fa-repeat"></i>
          <span>Subscriptions</span>
        </a>
      </li>

      <li>
        <a href="profile.html">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
      </li>

    </ul>

  </aside>

  <!-- MAIN CONTENT -->

  <main class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

      <div>

        <h2>
          Transactions
        </h2>

        <p>
          Manage and monitor all your expenses.
        </p>

      </div>

      <button
        class="primary-btn"
        data-bs-toggle="modal"
        data-bs-target="#transactionModal">

        Add Transaction

      </button>

    </div>

    <!-- TRANSACTION TABLE -->

    <div class="chart-card">

      <div class="table-responsive">

        <table class="table align-middle">

          <thead>

            <tr>

              <th>Category</th>
              <th>Description</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Actions</th>

            </tr>

          </thead>

          <tbody id="transactionTableBody">

            <!-- TRANSACTIONS WILL COME HERE -->

          </tbody>

        </table>

      </div>

    </div>

  </main>

  <!-- ADD TRANSACTION MODAL -->

  <div class="modal fade"
    id="transactionModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content p-3 border-0"
        style="border-radius: 24px;">

        <div class="modal-header border-0">

          <h4>Add Transaction</h4>

          <button type="button"
            class="btn-close"
            data-bs-dismiss="modal"></button>

        </div>

        <div class="modal-body">

          <!-- FORM -->

          <form id="transactionForm">

            <!-- CATEGORY -->

            <div class="mb-3">

              <label class="form-label">
                Category
              </label>

              <select
                id="category"
                class="form-select custom-input"
                required>

                <option value="">
                  Select Category
                </option>

                <option>Food</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Travel</option>
                <option>Entertainment</option>
                <option>Health</option>

              </select>

            </div>

            <!-- DESCRIPTION -->

            <div class="mb-3">

              <label class="form-label">
                Description
              </label>

              <input
                type="text"
                id="description"
                class="form-control custom-input"
                placeholder="Enter description"
                required>

            </div>

            <!-- AMOUNT -->

            <div class="mb-3">

              <label class="form-label">
                Amount
              </label>

              <input
                type="number"
                id="amount"
                class="form-control custom-input"
                placeholder="Enter amount"
                required>

            </div>

            <!-- DATE -->

            <div class="mb-4">

              <label class="form-label">
                Date
              </label>

              <input
                type="date"
                id="date"
                class="form-control custom-input"
                required>

            </div>

            <!-- BUTTON -->

            <button
              type="submit"
              class="primary-btn w-100">

              Save Transaction

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- BOOTSTRAP -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS -->

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/transactions.js"></script>

</body>

</html>
