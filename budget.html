<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Budget | Finova</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Icons -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">

      <img src="assets/logo.png" alt="Logo">

      <span>Finova</span>

    </div>

    <ul class="sidebar-links">

      <li>
        <a href="dashboard.html">
          <i class="fa-solid fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <li>
        <a href="transactions.html">
          <i class="fa-solid fa-wallet"></i>
          <span>Transactions</span>
        </a>
      </li>

      <li>
        <a href="analytics.html">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Analytics</span>
        </a>
      </li>

      <li>
        <a href="budget.html" class="active">
          <i class="fa-solid fa-money-bill"></i>
          <span>Budget</span>
        </a>
      </li>

      <li>
        <a href="subscriptions.html">
          <i class="fa-solid fa-repeat"></i>
          <span>Subscriptions</span>
        </a>
      </li>

      <li>
        <a href="profile.html">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
      </li>

    </ul>

  </aside>

  <!-- MAIN CONTENT -->

  <main class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

      <div>

        <h2>
          Budget Planner
        </h2>

        <p>
          Plan your monthly spending smartly.
        </p>

      </div>

      <button
        class="primary-btn"
        data-bs-toggle="modal"
        data-bs-target="#budgetModal">

        Set Budget

      </button>

    </div>

    <!-- BUDGET CARDS -->

    <div class="row g-4">

      <!-- TOTAL BUDGET -->

      <div class="col-lg-4">

        <div class="finance-card">

          <h5>Total Budget</h5>

          <h2 id="totalBudget">
            ₹0
          </h2>

        </div>

      </div>

      <!-- TOTAL SPENT -->

      <div class="col-lg-4">

        <div class="finance-card">

          <h5>Total Spent</h5>

          <h2 id="totalSpent">
            ₹0
          </h2>

        </div>

      </div>

      <!-- REMAINING -->

      <div class="col-lg-4">

        <div class="finance-card">

          <h5>Remaining Budget</h5>

          <h2 id="remainingBudget">
            ₹0
          </h2>

        </div>

      </div>

    </div>

    <!-- PROGRESS SECTION -->

    <div class="chart-card mt-4">

      <div class="d-flex justify-content-between mb-3">

        <div>

          <h4>
            Budget Usage
          </h4>

          <p>
            Monthly spending progress
          </p>

        </div>

        <h5 id="budgetPercent">
          0%
        </h5>

      </div>

      <!-- PROGRESS BAR -->

      <div class="progress custom-progress">

        <div
          id="budgetProgressBar"
          class="progress-bar custom-progress-bar"
          style="width: 0%">

        </div>

      </div>

    </div>

  </main>

  <!-- MODAL -->

  <div class="modal fade"
    id="budgetModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content p-3 border-0"
        style="border-radius: 24px;">

        <div class="modal-header border-0">

          <h4>Set Monthly Budget</h4>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal">

          </button>

        </div>

        <div class="modal-body">

          <!-- FORM -->

          <form id="budgetForm">

            <div class="mb-4">

              <label class="form-label">
                Monthly Budget
              </label>

              <input
                type="number"
                id="budgetInput"
                class="form-control custom-input"
                placeholder="Enter budget amount"
                required>

            </div>

            <button
              type="submit"
              class="primary-btn w-100">

              Save Budget

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- BOOTSTRAP -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS -->

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/budget.js"></script>

</body>

</html>
